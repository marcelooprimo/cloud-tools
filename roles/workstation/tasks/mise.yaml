# mise (mise-en-place) — gerenciador único de versões de ferramentas
# https://mise.jdx.dev

- name: Ensure /etc/apt/keyrings exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: mise_install | bool and ansible_os_family == "Debian"

- name: Install mise apt key
  become: true
  ansible.builtin.get_url:
    url: "https://mise.jdx.dev/gpg-key.pub"
    dest: /etc/apt/keyrings/mise.asc
    mode: "0644"
  when: mise_install | bool and ansible_os_family == "Debian"

- name: Add mise apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/mise.asc arch=amd64] https://mise.jdx.dev/deb stable main"
    state: present
    filename: mise
  when: mise_install | bool and ansible_os_family == "Debian"

- name: Install mise (apt)
  become: true
  ansible.builtin.apt:
    update_cache: true
    name: mise
  when: mise_install | bool and ansible_os_family == "Debian"

# openSUSE: instalador oficial (sem repo zypper oficial)
- name: Download mise installer (openSUSE)
  ansible.builtin.get_url:
    url: "https://mise.run"
    dest: /tmp/mise-install.sh
    mode: "0755"
  when: mise_install | bool and ansible_os_family == "Suse"

- name: Install mise on openSUSE
  ansible.builtin.command:
    cmd: /tmp/mise-install.sh
    creates: "{{ home_user }}/.local/bin/mise"
  when: mise_install | bool and ansible_os_family == "Suse"

- name: Check if bashrc exists
  ansible.builtin.stat:
    path: "{{ home_user }}/.bashrc"
  register: bashrc

- name: Check if zshrc exists
  ansible.builtin.stat:
    path: "{{ home_user }}/.zshrc"
  register: zshrc

- name: Activate mise (.bashrc)
  ansible.builtin.lineinfile:
    path: "{{ home_user }}/.bashrc"
    line: 'eval "$(mise activate bash)"'
    state: present
  when: mise_install | bool and bashrc.stat.exists

- name: Activate mise (.zshrc)
  ansible.builtin.lineinfile:
    path: "{{ home_user }}/.zshrc"
    line: 'eval "$(mise activate zsh)"'
    state: present
  when: mise_install | bool and zshrc.stat.exists

- name: Create mise config directory
  ansible.builtin.file:
    path: "{{ home_user }}/.config/mise"
    state: directory
    mode: "0755"
  when: mise_install | bool

- name: Deploy mise global config
  ansible.builtin.copy:
    dest: "{{ home_user }}/.config/mise/config.toml"
    mode: "0644"
    content: |
      [tools]
      awscli = "{{ awscli_version }}"
      checkov = "{{ checkov_version }}"
      cosign = "{{ cosign_version }}"
      gitleaks = "{{ gitleaks_version }}"
      go = "{{ golang_version }}"
      "ubi:kubescape/kubescape" = "{{ kubescape_version }}"
      helm = "{{ helm_version }}"
      helm-docs = "{{ helm_docs_version }}"
      helmfile = "{{ helmfile_version }}"
      kubectl = "{{ kubectl_version }}"
      node = "{{ node_version }}"
      pre-commit = "{{ pre_commit_version }}"
      shellcheck = "{{ shellcheck_version }}"
      sops = "{{ sops_version }}"
      terraform = "{{ terraform_version }}"
      terraform-docs = "{{ terraform_docs_version }}"
      terragrunt = "{{ terragrunt_version }}"
      tflint = "{{ tflint_version }}"
      {% if trivy_install | bool %}
      trivy = "{{ trivy_version }}"
      {% endif %}
      yq = "{{ yq_version }}"
      "pipx:oci-cli" = "{{ oci_cli_version }}"

      [settings]
      idiomatic_version_file_enable_tools = ["node", "terraform"]
  when: mise_install | bool

- name: Install tools with mise
  ansible.builtin.shell:
    cmd: "mise install --yes"
  environment:
    PATH: "{{ home_user }}/.local/bin:{{ ansible_env.PATH }}"
  register: mise_install_result
  changed_when: "'all tools are installed' not in (mise_install_result.stdout + mise_install_result.stderr)"
  when: mise_install | bool
