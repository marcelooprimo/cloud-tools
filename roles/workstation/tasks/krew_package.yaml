# Faz download do krew (versão pinada, checksum publicado na release)
- name: Downloading Krew
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/krew/releases/download/{{ krew_version }}/{{ krew_package }}.tar.gz"
    dest: "/tmp/{{ krew_package }}.tar.gz"
    mode: "0644"
    checksum: "sha256:https://github.com/kubernetes-sigs/krew/releases/download/{{ krew_version }}/{{ krew_package }}.tar.gz.sha256"

- name: Extracting Krew
  ansible.builtin.unarchive:
    src: "/tmp/{{ krew_package }}.tar.gz"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/{{ krew_package }}"

# Instala o krew
- name: Installing Krew
  ansible.builtin.shell:
    cmd: "/tmp/{{ krew_package }} install krew"
    creates: "{{ home_user }}/.krew/bin/kubectl-krew"
