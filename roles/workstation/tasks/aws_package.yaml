# AWS CLI v2 é instalado via mise (mise.yaml) — o zip oficial não publica
# checksum simples e o instalador não é idempotente; o backend aqua do mise
# baixa a release verificando checksum.

# AWS SSM plugin — a AWS não publica checksums para o pacote; instalado do
# canal oficial "latest" (decisão documentada no plano de melhoria).
- name: Installing AWS SSM on Ubuntu/Linux Mint/Pop_OS
  become: true
  ansible.builtin.apt:
    deb: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
  when: ansible_os_family == "Debian"

- name: Installing AWS SSM on openSUSE
  become: true
  community.general.zypper:
    name: "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/linux_64bit/session-manager-plugin.rpm"
    disable_gpg_check: true
  when: ansible_os_family == "Suse"

# AWS IAM Authentication (checksum publicado na release)
- name: Installing IAM Authentication
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v{{ iam_auth_version }}/aws-iam-authenticator_{{ iam_auth_version }}_linux_amd64"
    dest: "/usr/local/bin/aws-iam-authenticator"
    mode: "0755"
    checksum: "sha256:https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v{{ iam_auth_version }}/authenticator_{{ iam_auth_version }}_checksums.txt"
