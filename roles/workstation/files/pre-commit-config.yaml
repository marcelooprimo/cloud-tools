# Template de .pre-commit-config.yaml — copie para a raiz dos seus repositórios.
# Instalado em ~/.config/cloud-tools/pre-commit-config.yaml pelo playbook.
# Hooks de segurança mínimos: secret scanning + higiene de arquivos.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
